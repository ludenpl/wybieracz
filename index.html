<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jakie BMW pasuje do Ciebie? — demo wybieracza</title>
  <style>
    :root {
      --bmw-blue: #0066b1;
      --bmw-blue-light: #1c98e0;
      --bg: #0a0a0a;
      --panel: #16181c;
      --panel-2: #1f232a;
      --line: #2c313a;
      --text: #f3f5f7;
      --muted: #9aa3ad;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .stage {
      width: 100%; max-width: 960px; background: linear-gradient(160deg, #11151b, #0c0f14);
      border: 1px solid var(--line); border-radius: 16px; padding: 36px 40px 44px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5); position: relative;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .progress-label { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .brand { font-weight: 700; letter-spacing: .04em; }
    .brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }
    .bars { display: flex; gap: 6px; margin: 14px 0 30px; }
    .bars span { height: 3px; flex: 1; background: var(--line); border-radius: 2px; }
    .bars span.on { background: var(--bmw-blue-light); }
    h1 { font-size: 30px; font-weight: 300; line-height: 1.2; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .01em; }
    .hint { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .opt {
      background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px;
      padding: 22px 18px; cursor: pointer; transition: .15s; text-align: center; font-size: 16px;
      display: flex; align-items: center; justify-content: center; min-height: 92px; position: relative;
    }
    .opt:hover { border-color: var(--bmw-blue-light); background: var(--panel-2); }
    .opt.sel { border-color: var(--bmw-blue-light); background: rgba(28,152,224,.12); }
    .opt.sel::after {
      content: "✓"; position: absolute; top: 8px; right: 10px; color: var(--bmw-blue-light);
      font-size: 14px; font-weight: 700;
    }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 26px; }
    button {
      font: inherit; cursor: pointer; border-radius: 10px; padding: 14px 26px; border: 1px solid var(--line);
      background: transparent; color: var(--text); transition: .15s;
    }
    button:hover { border-color: var(--bmw-blue-light); }
    button.primary { background: #fff; color: #111; border-color: #fff; font-weight: 600; }
    button.primary:disabled { opacity: .4; cursor: not-allowed; }
    button.wide { width: 100%; }
    .center { text-align: center; }
    /* loading */
    .loader { text-align: center; padding: 40px 0; }
    .spinner { width: 64px; height: 64px; border: 4px solid var(--line); border-top-color: var(--bmw-blue-light);
      border-radius: 50%; margin: 24px auto; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* result */
    .result-card { background: linear-gradient(135deg, #1b2430, #11151b); border: 1px solid var(--line);
      border-radius: 14px; padding: 30px; margin-bottom: 18px; }
    .match-name { font-size: 34px; font-weight: 300; margin: 0; }
    .match-pct { color: var(--bmw-blue-light); letter-spacing: .12em; font-size: 14px; margin: 6px 0 16px; text-transform: uppercase; }
    .match-desc { color: #d4dae1; max-width: 560px; line-height: 1.5; }
    .unmet { margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: rgba(224,138,28,.12);
      border: 1px solid rgba(224,138,28,.5); color: #f0b870; font-size: 14px; }
    .alts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .alt { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
    .alt .n { font-size: 18px; }
    .alt .p { color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; }
    .alt small.note { color: #d89a4e; display: block; margin-top: 6px; }
    .subhead { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 22px 0 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .full { display: none; }
    .full.show { display: block; }
    .policy { margin-top: 20px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .policy input { accent-color: var(--bmw-blue-light); }
    .intro { text-align: center; padding: 30px 0; }
    .intro h1 { font-size: 40px; }
    .intro p { color: var(--muted); max-width: 460px; margin: 8px auto 26px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <script type="module">
    import { QUESTIONS } from './src/questions.js';
    import { recommend, unmetMessage } from './src/recommender.js';

    const stage = document.getElementById('stage');
    let step = -1;                 // -1 = intro, 0..4 = pytania, 5 = loading, 6 = wynik
    const answers = {};
    let prioritizeCompliant = false;

    const topbar = (idx) => `
      <div class="topbar">
        <div class="progress-label">Pytanie ${idx + 1} z ${QUESTIONS.length}</div>
        <div class="brand">BMW Premium Arena <small>Kalisz</small></div>
      </div>
      <div class="bars">${QUESTIONS.map((_, i) => `<span class="${i <= idx ? 'on' : ''}"></span>`).join('')}</div>`;

    function renderIntro() {
      stage.innerHTML = `
        <div class="intro">
          <div class="brand" style="margin-bottom:24px">BMW Premium Arena <small>Kalisz</small></div>
          <h1>Jakie BMW<br>pasuje do Ciebie?</h1>
          <p>W mniej niż 2 minuty odkryj model dopasowany do Twojego stylu życia.</p>
          <button class="primary" id="start">Rozpocznij test →</button>
        </div>`;
      document.getElementById('start').onclick = () => { step = 0; renderQuestion(); };
    }

    function renderQuestion() {
      const q = QUESTIONS[step];
      const isMulti = q.type === 'multi';
      const sel = answers[q.id] || (isMulti ? [] : null);
      const cols = q.options.length <= 4 ? 'cols-2' : '';
      stage.innerHTML = `
        ${topbar(step)}
        <h1>${q.title}</h1>
        ${q.hint ? `<p class="hint">${q.hint}</p>` : ''}
        <div class="grid ${cols}" id="grid">
          ${q.options.map((o) => {
            const on = isMulti ? sel.includes(o.id) : sel === o.id;
            return `<div class="opt ${on ? 'sel' : ''}" data-id="${o.id}">${o.label}</div>`;
          }).join('')}
        </div>
        <div class="actions">
          <button id="back">${step === 0 ? '← Start' : '← Wstecz'}</button>
          ${isMulti ? `<button class="primary" id="next">Dalej →</button>` : '<span></span>'}
        </div>`;

      grid.querySelectorAll('.opt').forEach((el) => {
        el.onclick = () => onPick(q, el.dataset.id, isMulti);
      });
      document.getElementById('back').onclick = goBack;
      const nextBtn = document.getElementById('next');
      if (nextBtn) {
        nextBtn.disabled = (answers[q.id] || []).length === 0;
        nextBtn.onclick = goNext;
      }
    }

    function onPick(q, id, isMulti) {
      if (isMulti) {
        const cur = new Set(answers[q.id] || []);
        if (cur.has(id)) cur.delete(id);
        else if (cur.size < (q.max || 99)) cur.add(id);
        answers[q.id] = [...cur];
        renderQuestion(); // odśwież zaznaczenia + stan przycisku Dalej
      } else {
        answers[q.id] = id;
        goNext(); // pojedynczy wybór = automatyczne przejście dalej
      }
    }

    function goNext() {
      if (step < QUESTIONS.length - 1) { step++; renderQuestion(); }
      else { step = QUESTIONS.length; renderLoading(); }
    }
    function goBack() {
      if (step === 0) { step = -1; renderIntro(); }
      else { step--; renderQuestion(); }
    }

    function renderLoading() {
      stage.innerHTML = `
        <div class="loader">
          <div class="brand center">BMW Premium Arena <small>Kalisz</small></div>
          <div class="spinner"></div>
          <h1 style="font-size:24px">Dopasowujemy BMW<br>do Twojego stylu życia…</h1>
          <p class="hint">To potrwa tylko chwilę.</p>
        </div>`;
      setTimeout(renderResult, 1400);
    }

    function renderResult() {
      const { best, alternatives, ranking } = recommend(answers, { config: { prioritizeCompliant } });
      const note = unmetMessage(best);
      const altNote = (r) => { const m = unmetMessage(r); return m ? `<small class="note">${m}</small>` : ''; };

      stage.innerHTML = `
        <div class="topbar"><h1 style="font-size:24px;margin:0">Oto Twoje BMW.</h1>
          <div class="brand">BMW Premium Arena <small>Kalisz</small></div></div>
        <div class="result-card">
          <p class="match-name">${best.model.name}</p>
          <p class="match-pct">${best.percent}% dopasowania</p>
          <p class="match-desc">${best.model.desc}</p>
          ${note ? `<div class="unmet">⚠ ${note}</div>` : ''}
          <div style="margin-top:22px"><button class="primary">Chcę poznać ofertę →</button></div>
        </div>

        <div class="subhead">Inne modele, które mogą Cię zainteresować:</div>
        <div class="alts">
          ${alternatives.map((r, i) => `
            <div class="alt">
              <div class="n">${i + 2}) ${r.model.name}</div>
              <div class="p">${r.percent}% dopasowania</div>
              ${altNote(r)}
            </div>`).join('')}
        </div>

        <button class="wide" id="toggleAll" style="margin-top:18px">Zobacz wszystkie modele →</button>
        <div class="full" id="full">
          <table>
            <thead><tr><th>#</th><th>Model</th><th>Dopasowanie</th><th>Uwagi</th></tr></thead>
            <tbody>
              ${ranking.map((r, i) => `
                <tr>
                  <td>${i + 1}</td>
                  <td>${r.model.name}</td>
                  <td>${r.percent}%</td>
                  <td style="color:#d89a4e">${unmetMessage(r) || ''}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>

        <label class="policy">
          <input type="checkbox" id="policy" ${prioritizeCompliant ? 'checked' : ''} />
          Polityka twardych wymogów: model bez braków zawsze na czele
          (odznaczone = najlepszy wynik na czele, nawet z adnotacją — np. M4 86%)
        </label>
        <div class="actions"><button id="restart">↺ Zacznij od nowa</button><span></span></div>`;

      document.getElementById('toggleAll').onclick = (e) => {
        document.getElementById('full').classList.toggle('show');
        e.target.textContent = document.getElementById('full').classList.contains('show')
          ? 'Ukryj listę ↑' : 'Zobacz wszystkie modele →';
      };
      document.getElementById('policy').onchange = (e) => { prioritizeCompliant = e.target.checked; renderResult(); };
      document.getElementById('restart').onclick = () => {
        for (const k of Object.keys(answers)) delete answers[k];
        step = -1; renderIntro();
      };
    }

    renderIntro();
  </script>
</body>
</html>
